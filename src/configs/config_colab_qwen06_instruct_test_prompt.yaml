dataset_config:
  train_file_path: /content/syntax_finetuning/src/data/dataset_simple_rel/gsd_grct_test/test_grct_train.json
  dev_file_path: /content/syntax_finetuning/src/data/dataset_simple_rel/gsd_grct_test/test_grct_dev.json
  test_file_path: /content/syntax_finetuning/src/data/dataset_simple_rel/gsd_grct_test/test_grct_test.json
  conll_test_file_path: /content/syntax_finetuning/src/data/dataset_simple_rel/gsd_grct_test/test_conll_test.conllu
  # conll_test_file_path is used for metric evaluation 
  treebank_repr: grct
  treebank: gsd_test_grct
inference_models:
  - original_model_id: RefalMachine/RuadaptQwen3-4B-Hybrid
    is_instruct: True
    name: RuadaptQwen3_4B_Hybrid_syntagrus_grct_conll_short
    model_library: vllm
    max_tokens: 5000
    representation_type_result: conll_short
  - original_model_id: RefalMachine/RuadaptQwen3-4B-Hybrid
    is_instruct: True
    name: RuadaptQwen3_4B_Hybrid_syntagrus_grct_conll
    model_library: vllm
    max_tokens: 5000
    representation_type_result: conll
root_output_dir_path: /content/results/only_test
inference:
  - prompt_name: prompt_short_1
    sampling_params: { "temperature": 0.3, "top_p": 0.9, "top_k": 40, "max_tokens": 2048, "repetition_penalty": 1.0, "seed": 42 }
    #prompt_name: prompt3
    #stop_prefix: |
    #  Результат:
    seed:
        - 1000
    model_parameters:
        - model_name: RuadaptQwen3_4B_Hybrid_syntagrus_grct_conll_short
    treebank_parameters:
        - treebank_name: gsd_test_grct
          index_finish: 30
  - prompt_name: prompt_full_1
    seed:
        - 1000
    model_parameters:
        - model_name: RuadaptQwen3_4B_Hybrid_syntagrus_grct_conll
    treebank_parameters:
        - treebank_name: gsd_test_grct
          index_finish: 30
